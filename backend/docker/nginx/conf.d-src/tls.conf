# Phase 2 -- a certificate exists. Selected by 10-select-config.sh, which
# switches to this file automatically once certbot has issued a lineage and
# reloads nginx. No file on the server is ever hand-edited.
server {
    listen 80;
    listen [::]:80;
    server_name ${DOMAIN};

    # Kept in plaintext and kept first: this is how certbot proves control for a
    # *renewal*, which must keep working long after the initial issuance.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # `http2 on` rather than `listen 443 ssl http2`, which nginx deprecated in
    # 1.25.1.
    http2 on;
    server_name ${DOMAIN};

    ssl_certificate     /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 2m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    location /static/ {
        alias /var/www/static/;
        access_log off;
        expires 7d;
    }

    # No `location /media/`: settings.py defines no MEDIA_ROOT, no model has a
    # FileField, and every API view is GET-only, so nothing ever writes one.

    location / {
        proxy_pass http://web:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # See http-only.conf: the rightmost entry is the address nginx saw, which
        # is exactly what DJANGO_NUM_PROXIES=1 relies on.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Hardcoded rather than $scheme, because this block only ever serves TLS.
        proxy_set_header X-Forwarded-Proto https;

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
