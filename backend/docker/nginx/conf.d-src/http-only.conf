# Phase 1 -- no certificate exists yet.
#
# nginx resolves `ssl_certificate` paths when it parses its configuration, so a
# `listen 443 ssl` block pointing at a certificate that does not exist is a fatal
# error, not a warning: nginx would exit and `restart: unless-stopped` would turn
# that into a crash loop. But the HTTP-01 challenge that obtains the certificate
# needs nginx serving /.well-known/acme-challenge/ -- so the TLS listener cannot
# exist until the certificate does, and this file exists for that window.
#
# Selected by 10-select-config.sh, which swaps to tls.conf once the certificate
# appears. `restart: unless-stopped` is why this is a real phase and not just a
# first-boot state.
server {
    listen 80;
    listen [::]:80;
    server_name ${DOMAIN};

    client_max_body_size 2m;

    # Must stay reachable in the TLS phase too -- it is how renewals are proved.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /static/ {
        alias /var/www/static/;
        access_log off;
        expires 7d;
    }

    location / {
        proxy_pass http://web:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Appends $remote_addr to whatever the client sent. This is what makes
        # DJANGO_NUM_PROXIES=1 correct: DRF reads the rightmost entry, which is
        # the address nginx itself saw, and a client cannot control it.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
